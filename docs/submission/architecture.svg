<title id="title">Kiến trúc Topeye Scenario Studio</title>
<desc id="desc">Trình duyệt gọi Node local server; server điều phối Python workers đọc nuScenes, chạy esmini, lưu workspace và xuất gói. CARLA là tích hợp tùy chọn.</desc>
