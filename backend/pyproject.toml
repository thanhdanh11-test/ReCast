[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topeye"
version = "0.23.0"
description = "LiDAR and surround-camera annotation processing core"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn", "numpy", "scipy", "opencv-python-headless", "pyquaternion",
  "sqlalchemy>=2", "alembic", "lxml>=5", "shapely==2.1.2",
]

[project.scripts]
topeye-scenario = "topeye.scenario.cli:main"
topeye-prepare = "topeye.prepare:main"
topeye-export-splat = "topeye.export_splat:main"
topeye-sim-build = "topeye.sim.cli:build_main"
topeye-sim-layout = "topeye.sim.cli:layout_main"
topeye-sim-render = "topeye.sim.cli:render_main"
topeye-sim-view = "topeye.sim.view:main"
topeye-sim-gsdata = "topeye.sim.gs_data:main"
topeye-sim-fo = "topeye.sim.fo_dataset:main"

[project.optional-dependencies]
av2 = ["pyarrow>=18,<27"]
scenario-build = ["cmake==3.31.6"]
dev = ["pytest", "ruff", "httpx", "pyarrow>=18,<27"]
ground = ["pypatchworkpp"]
mesh = ["open3d"]
fiftyone = ["fiftyone", "umap-learn", "torchvision", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
