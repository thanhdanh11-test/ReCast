<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReCast sim map</title>
<style>
  :root { --bg: #11151b; --panel: rgba(17, 21, 27, 0.88); --text: #e6e9ee; --muted: #8b95a3;
          --accent: #ffd34d; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; width: 300px; max-height: calc(100vh - 48px); overflow: auto; padding: 12px 14px;
           background: var(--panel); border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.4); }
  #panel h1 { font-size: 15px; margin: 0 0 6px; }
  #panel .muted { color: var(--muted); }
  #panel label { display: flex; align-items: center; gap: 6px; margin: 4px 0; cursor: pointer; }
  #panel select, #panel input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  button { background: #2a3340; color: var(--text); border: 0; border-radius: 6px;
           padding: 5px 10px; cursor: pointer; }
  button:hover { background: #374253; }
  #legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; margin-top: 8px; }
  #legend span::before { content: ""; display: inline-block; width: 10px; height: 10px;
                         margin-right: 5px; border-radius: 2px; background: var(--c); }
  #status { margin-top: 8px; color: var(--muted); white-space: pre-line; }
  details { border-top: 1px solid #374253; margin-top: 10px; padding-top: 8px; }
  summary { cursor: pointer; font-weight: 600; }
  input[type=number], select { background: #2a3340; color: var(--text); border: 1px solid #526070; }
  button:disabled { opacity: .45; cursor: default; }
  #gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
  #gallery img { width: 100%; }
  #jobStatus, #checks { white-space: pre-wrap; overflow-wrap: anywhere; }
  #error { color: #ff8080; white-space: pre-line; }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1 id="title">ReCast sim map</h1>
  <div class="muted">Kéo chuột trái: xoay · phải: dời · cuộn: zoom</div>
  <div class="row"><button id="play">▶</button><input id="frame" type="range" min="0" value="0">
    <span id="frameLabel">0</span></div>
  <label><input type="checkbox" id="showGround" checked> Mặt đường (vạch sơn từ LiDAR)</label>
  <label><input type="checkbox" id="showStatic" checked> Nhà / cây</label>
  <label><input type="checkbox" id="showActors" checked> Xe / người</label>
  <label style="margin-left: 16px;"><input type="checkbox" id="useLibraryActors" checked> Mẫu thư viện / Khối hộp</label>
  <label><input type="checkbox" id="showEgo" checked> Quỹ đạo ego</label>
  <div class="row"><span>Run / môi trường</span><select id="run"><option value="">tắt</option></select></div>
  <div class="row"><button id="follow">Về xe ego</button><button id="top">Nhìn từ trên</button></div>
  <details open><summary>Môi trường</summary>
    <label>Thời tiết <select id="preset"><option value="day">Ngày</option><option value="night">Đêm</option><option value="rain">Mưa</option><option value="fog">Sương</option><option value="dusk">Hoàng hôn</option></select></label>
    <label>Mây <input id="cloudiness" type="range" min="0" max="100" step="1" value="0"></label>
    <label>Góc cao mặt trời (°) <input id="sun_altitude_angle" type="range" min="-90" max="90" step="1" value="45"></label>
    <label>Phương vị mặt trời (°) <input id="sun_azimuth_angle" type="range" min="0" max="360" step="1" value="30"></label>
    <label>Mật độ sương (%) <input id="fog_density" type="range" min="0" max="100" step="1" value="0"></label>
    <label>Sương bắt đầu (m) <input id="fog_distance" type="range" min="0" max="200" step="1" value="0"></label>
    <label>Mưa (%) <input id="precipitation" type="range" min="0" max="100" step="1" value="0"></label>
    <label>Vũng nước (%) <input id="precipitation_deposits" type="range" min="0" max="100" step="1" value="0"></label>
    <label>Gió (%) <input id="wind_intensity" type="range" min="0" max="100" step="1" value="0"></label>
    <label>Ướt đường (%) <input id="wetness" type="range" min="0" max="100" step="1" value="0"></label>
    <label><input id="rainEnabled" type="checkbox">Vệt mưa</label>
    <label>Vạch mờ <input id="paint_fade" type="range" min="0" max="1" step="0.01" value="0"></label>
  </details>
  <details><summary>Giao thông</summary>
    <label>Chế độ <select id="mode"><option value="replay">Phát lại</option><option value="generated">Sinh mới</option></select></label>
    <label>Mật độ <input id="density" type="range" min="0" max="3" step="0.1" value="1"></label>
    <label>Tốc độ <input id="speed_scale" type="range" min="0.5" max="2" step="0.1" value="1"></label>
    <label>Biến thiên tốc độ <input id="speed_jitter" type="range" min="0" max="0.5" step="0.01" value="0.15"></label>
    <label>Chuyển làn <input id="lane_change_rate" type="range" min="0" max="1" step="0.01" value="0.2"></label>
    <label>Mức quyết liệt <input id="aggressiveness" type="range" min="0" max="1" step="0.01" value="0.3"></label>
    <label>Người đi bộ <input id="pedestrians" type="range" min="0" max="3" step="0.1" value="1"></label>
    <label>Cách xe trước (m) <input id="distance_to_leading" type="range" min="0.5" max="10" step="0.1" value="2.5"></label>
    <label>Chậm hơn giới hạn (%) <input id="speed_difference_percent" type="range" min="-50" max="80" step="1" value="0"></label>
    <label>Chuyển làn ngẫu nhiên (%) <input id="random_lanechange_percent" type="range" min="0" max="100" step="1" value="0"></label>
    <label>Gia tốc tối đa (m/s²) <input id="max_accel" type="range" min="0.5" max="6" step="0.1" value="3"></label>
    <label>Phanh tối đa (m/s²) <input id="max_decel" type="range" min="1" max="9" step="0.1" value="6"></label>
    <label>Gia tốc ngang tối đa (m/s²) <input id="max_lateral_accel" type="range" min="1" max="8" step="0.1" value="4"></label>
    <label><input id="keep_parked" type="checkbox" checked>Giữ xe đỗ</label>
    <label>Seed <input id="seed" type="number" step="1" value="0"></label>
    <button id="generate">Sinh giao thông</button><div id="checks" aria-live="polite"></div>
  </details>
  <details><summary>Render Blender</summary>
    <label>Tên scenario <input id="scenarioName" value="web-preview" pattern="[a-z0-9_-]+"></label>
    <button id="render">Render frame đang xem · 6 camera</button>
    <div id="jobStatus" aria-live="polite"></div><div id="gallery"></div>
  </details>
  <details><summary>Lớp nền</summary>
    <label><select id="background"><option value="voxel">Voxel</option><option value="splat" disabled>Điểm LiDAR màu</option><option value="msplat" disabled>Ảnh thật – msplat (mới, nét)</option><option value="trained" disabled>Ảnh thật – bản cũ 15 phút</option></select></label>
    <label><input id="photoGround" type="checkbox" disabled>Mặt đường ảnh thật</label>
  </details>
  <div id="legend"></div>
  <div id="status">Đang tải…</div>
  <div id="error"></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.3.1/spark.module.js" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { PLYLoader } from "three/addons/loaders/PLYLoader.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
import { Sky } from "three/addons/objects/Sky.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const COLORS = { car: "#4f8ef7", truck: "#f7a64f", bus: "#c04ff7", trailer: "#a8743c",
  construction_vehicle: "#f7e14f", pedestrian: "#ff4f6d", motorcycle: "#4ff7c8",
  bicycle: "#7cf74f", barrier: "#ff8c2a", traffic_cone: "#ff5a1f" };
const scene = new URLSearchParams(location.search).get("scene");
const $ = (id) => document.getElementById(id);
const status = (text) => { $("status").textContent = text; };

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
// Game-style look: filmic tone mapping + soft sun shadows (ground truth is unaffected).
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$("view").appendChild(renderer.domElement);
const world = new THREE.Scene();
world.background = new THREE.Color("#1a2029");
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 2000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
const ambient = new THREE.HemisphereLight("#dfe8ff", "#30343a", 1.6);
world.add(ambient);
const sun = new THREE.DirectionalLight("#ffffff", 1.6);
sun.position.set(40, -30, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, {left: -90, right: 90, top: 90, bottom: -90, near: 1, far: 600});
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
world.add(sun, sun.target);

// Physical sky: background + image-based lighting rebuilt whenever the sun moves.
const sky = new Sky();
sky.scale.setScalar(4000);
Object.assign(sky.material.uniforms.turbidity, {value: 6});
Object.assign(sky.material.uniforms.rayleigh, {value: 1.6});
sky.material.uniforms.up.value.set(0, 0, 1);
const skyScene = new THREE.Scene();
skyScene.add(sky);
const pmrem = new THREE.PMREMGenerator(renderer);
let skyTarget = null;
function updateSky(direction, night) {
  sky.material.uniforms.sunPosition.value.copy(direction);
  sky.visible = !night;
  if (skyTarget) skyTarget.dispose();
  skyTarget = night ? null : pmrem.fromScene(skyScene, 0.02);
  world.environment = skyTarget ? skyTarget.texture : null;
  world.environmentIntensity = 0.8;
}
world.add(sky);

// Shadows + alpha-tested foliage for every loaded mesh.
function prepareMeshes(root, {cast = true, receive = true} = {}) {
  root.traverse((child) => {
    if (!child.isMesh) return;
    child.castShadow = cast;
    child.receiveShadow = receive;
    for (const m of Array.isArray(child.material) ? child.material : [child.material]) {
      if (!m) continue;
      if (m.map && (m.transparent || m.alphaMap || m.alphaTest > 0)) {
        m.alphaTest = Math.max(m.alphaTest, 0.45);
        m.transparent = false;
        m.depthWrite = true;
        m.side = THREE.DoubleSide;
      }
      m.needsUpdate = true;
    }
  });
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(world, camera));
const gtao = new GTAOPass(world, camera, innerWidth, innerHeight);
gtao.updateGtaoMaterial({radius: 1.2, distanceExponent: 1.5, thickness: 2, scale: 1.2});
composer.addPass(gtao);
composer.addPass(new OutputPass());

// Render on demand only: an idle map costs no GPU time.
let dirty = true;
const redraw = () => { dirty = true; };
controls.addEventListener("change", redraw);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  redraw();
}
addEventListener("resize", resize);
resize();

async function json(path) {
  const response = await fetch(path);
  if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
  return response.json();
}

function loadImage(path) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error(`Không tải được ${path}`));
    image.src = path;
  });
}

function pixels(image) {
  const canvas = document.createElement("canvas");
  canvas.width = image.width;
  canvas.height = image.height;
  const context = canvas.getContext("2d");
  context.drawImage(image, 0, 0);
  return context.getImageData(0, 0, image.width, image.height);
}

let roadImages;
async function groundTexture(layout, fade = 0) {
  roadImages ||= Promise.all([
    loadImage(`${scene}/${layout.ground.drivable}`), loadImage(`${scene}/${layout.ground.paint}`)]);
  const [drivable, paint] = await roadImages;
  const road = pixels(drivable), marks = pixels(paint);
  const canvas = document.createElement("canvas");
  canvas.width = road.width;
  canvas.height = road.height;
  const out = canvas.getContext("2d").createImageData(road.width, road.height);
  for (let i = 0; i < out.data.length; i += 4) {
    const base = road.data[i] > 0 ? 58 : 120;
    const t = Math.min(Math.max((marks.data[i] / 255 - 0.3) / 0.3, 0), 1);
    const value = base + (235 - base) * t * (1 - fade);
    out.data[i] = value; out.data[i + 1] = value; out.data[i + 2] = value + (road.data[i] ? 4 : -10);
    out.data[i + 3] = 255;
  }
  canvas.getContext("2d").putImageData(out, 0, 0);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

async function puddleTexture(layout, coverage, roughness) {
  roadImages ||= Promise.all([
    loadImage(`${scene}/${layout.ground.drivable}`), loadImage(`${scene}/${layout.ground.paint}`)]);
  const road = pixels((await roadImages)[0]);
  const out = new Uint8Array(road.width*road.height*4);
  const quantiles = [0,.14497,.26715,.36759,.4467,.5,.5533,.63241,.73285,.85503,1];
  const q = Math.min(9, Math.floor(coverage*10));
  const threshold = THREE.MathUtils.lerp(quantiles[q],quantiles[q+1],coverage*10-q);
  for (let v=0; v<road.height; v++) for (let u=0; u<road.width; u++) {
    const x = layout.bounds.xmin + (u+.5)*layout.ground.tex_res_m;
    const y = layout.bounds.ymax - (v+.5)*layout.ground.tex_res_m;
    const noise = (Math.sin(.37*x)*Math.sin(.53*y)+1)/2;
    const index = (v*road.width+u)*4;
    const value = Math.round(255*(road.data[index] && noise < threshold ? .03 : roughness));
    out.set([value,value,value,255], index);
  }
  const texture = new THREE.DataTexture(out, road.width, road.height);
  texture.flipY = true;
  texture.needsUpdate = true;
  return texture;
}

async function loadGround(layout) {
  const geometry = await new PLYLoader().loadAsync(`${scene}/${layout.ground.mesh}`);
  const { xmin, ymin, xmax, ymax } = layout.bounds;
  const position = geometry.getAttribute("position");
  const uv = new Float32Array(position.count * 2);
  for (let i = 0; i < position.count; i++) {
    uv[2 * i] = (position.getX(i) - xmin) / (xmax - xmin);
    uv[2 * i + 1] = (position.getY(i) - ymin) / (ymax - ymin);
  }
  geometry.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  geometry.computeVertexNormals();
  const material = new THREE.MeshStandardMaterial({ map: await groundTexture(layout),
    roughness: 0.95, side: THREE.DoubleSide });
  const groundMesh = new THREE.Mesh(geometry, material);
  groundMesh.receiveShadow = true;
  return groundMesh;
}

async function loadStatic(layout) {
  const geometry = await new PLYLoader().loadAsync(`${scene}/${layout.static.mesh}`);
  const color = geometry.getAttribute("color");
  const c = new THREE.Color();
  for (let i = 0; i < color.count; i++) {
    c.setRGB(color.getX(i), color.getY(i), color.getZ(i), THREE.SRGBColorSpace);
    color.setXYZ(i, c.r, c.g, c.b);
  }
  geometry.computeVertexNormals();
  return new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ vertexColors: true,
    roughness: 0.9, flatShading: true }));
}

const CRC_TABLE = new Uint32Array(256);
for (let i = 0; i < 256; i++) {
  let c = i;
  for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
  CRC_TABLE[i] = c;
}

function crc32(str) {
  let crc = -1;
  const utf8 = new TextEncoder().encode(str);
  for (let i = 0; i < utf8.length; i++) {
    crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ utf8[i]) & 0xff];
  }
  return (crc ^ -1) >>> 0;
}

/**
 * Select a 3D library asset for an actor matching SPEC-S8 §2.
 * Rules (SPEC-S8 §2):
 * 1. Filter assets of the same class (asset.class === actor.label).
 * 2. Calculate anisotropic scale = target / native_size for each axis (l, w, h).
 * 3. Enforce distortion cap: max(scale) / min(scale) <= 1.3 (+ 1e-9).
 * 4. Rank candidates by closest shape ratio: norm(log(scale) - mean(log(scale))).
 * 5. Break ties deterministically: sort candidates by asset_id, then select pseudo-randomly
 *    using (crc32(actor.track) ^ seed).
 * Returns { asset, scale } or null if no valid candidate exists.
 */
function selectLibraryAsset(manifest, actor, seed = 0) {
  const target = actor?.size;
  if (!Array.isArray(target) || target.length !== 3 || target.some((v) => !Number.isFinite(v) || v <= 0)) {
    return null;
  }
  const candidates = [];
  for (const item of manifest) {
    if (item.class !== actor.label) continue;
    const native = item.native_size;
    if (!Array.isArray(native) || native.length !== 3 || native.some((v) => !Number.isFinite(v) || v <= 0)) {
      continue;
    }
    const scale = [target[0] / native[0], target[1] / native[1], target[2] / native[2]];
    const maxScale = Math.max(...scale);
    const minScale = Math.min(...scale);
    if (maxScale / minScale <= 1.3 + 1e-9) {
      const shape = scale.map(Math.log);
      const mean = (shape[0] + shape[1] + shape[2]) / 3;
      const dist = Math.hypot(shape[0] - mean, shape[1] - mean, shape[2] - mean);
      candidates.push({ dist, asset: item, scale });
    }
  }
  if (candidates.length === 0) return null;
  let best = Infinity;
  for (const c of candidates) if (c.dist < best) best = c.dist;
  const tied = candidates.filter((c) => Math.abs(c.dist - best) < 1e-9);
  tied.sort((a, b) => a.asset.asset_id.localeCompare(b.asset.asset_id));
  const track = String(actor.track || "");
  const hash = (crc32(track) ^ (Number(seed) || 0)) >>> 0;
  let t = (hash + 0x6D2B79F5) >>> 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  const idx = ((t ^ (t >>> 14)) >>> 0) % tied.length;
  return { asset: tied[idx].asset, scale: tied[idx].scale };
}

const gltfLoader = new GLTFLoader();
const gltfCache = new Map();

async function loadGlb(file) {
  const glbFile = file.replace(/\.blend$/, ".glb");
  const url = `/assets/${glbFile}`;
  if (!gltfCache.has(url)) {
    gltfCache.set(url, gltfLoader.loadAsync(url));
  }
  return await gltfCache.get(url);
}

async function attachLibraryModels(actorDataList, libraryGroup, frameTimes) {
  await Promise.all(actorDataList.map(async (item) => {
    if (!item.selection) return;
    try {
      const { asset, scale } = item.selection;
      const gltf = await loadGlb(asset.file);
      const root = new THREE.Group();
      const scaleGroup = new THREE.Group();
      scaleGroup.scale.set(scale[0], scale[1], scale[2]);
      root.add(scaleGroup);
      const modelWrapper = new THREE.Group();
      modelWrapper.rotation.x = Math.PI / 2;
      scaleGroup.add(modelWrapper);
      const model = SkeletonUtils.clone(gltf.scene);
      prepareMeshes(model, {receive: false});
      modelWrapper.add(model);

      if (asset.paint_material && item.actor.color && Array.isArray(item.actor.color) && item.actor.color.length === 3) {
        const col = item.actor.color;
        model.traverse((child) => {
          if (child.isMesh && child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            const newMats = mats.map((m) => {
              if (m.name === asset.paint_material || m.name.startsWith(asset.paint_material + ".")) {
                const clone = m.clone();
                clone.color.setRGB(col[0] / 255, col[1] / 255, col[2] / 255, THREE.SRGBColorSpace);
                return clone;
              }
              return m;
            });
            child.material = Array.isArray(child.material) ? newMats : newMats[0];
          }
        });
      }

      let mixer = null;
      let walkAction = null;
      let idleAction = null;
      if (asset.animated && gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);
        const walkClip = gltf.animations.find((c) => c.name === asset.walk_action);
        const idleClip = gltf.animations.find((c) => c.name === asset.idle_action);
        if (walkClip) walkAction = mixer.clipAction(walkClip);
        if (idleClip) idleAction = mixer.clipAction(idleClip);
      }

      const speeds = new Map();
      const keys = item.rawKeys;
      for (let k = 0; k < keys.length; k++) {
        const key = keys[k];
        let speed = 0;
        if (keys.length > 1) {
          const prev = k > 0 ? keys[k - 1] : keys[0];
          const curr = k > 0 ? keys[k] : keys[1];
          const tPrev = frameTimes.get(prev.frame) ?? 0;
          const tCurr = frameTimes.get(curr.frame) ?? 1;
          const dt = Math.max(tCurr - tPrev, 1e-6);
          const dist = Math.hypot(curr.center[0] - prev.center[0], curr.center[1] - prev.center[1]);
          speed = dist / dt;
        }
        const hScale = item.size[2] / asset.native_size[2];
        const playSpeed = asset.walk_speed_mps ? speed / (asset.walk_speed_mps * hScale) : 1;
        speeds.set(key.frame, { speed, playSpeed: Math.max(0.1, playSpeed), walking: speed >= 0.2 });
      }

      root.visible = false;
      root.position.set(0, 0, -1000);
      libraryGroup.add(root);

      item.model = { root, model, asset, scale, mixer, walkAction, idleAction, speeds };
    } catch (err) {
      console.warn(`Fallback to box for ${item.actor.track}:`, err);
      item.model = null;
    }
  }));
}

function buildActors(layout, manifest = [], frameTimes = new Map()) {
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ roughness: 0.5 }), layout.actors.length);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;

  const lamps = new THREE.InstancedMesh(new THREE.BoxGeometry(.08, .28, .16),
    new THREE.MeshStandardMaterial({color:"#fff0bd", emissive:"#ffe0a0", emissiveIntensity:2}),
    layout.actors.length * 2);
  lamps.frustumCulled = false;
  mesh.userData.lamps = lamps;
  mesh.userData.labels = layout.actors.map((a) => a.label);

  const libraryGroup = new THREE.Group();
  const group = new THREE.Group();
  group.add(mesh, lamps, libraryGroup);

  const actors = layout.actors.map((actor, i) => {
    mesh.setColorAt(i, new THREE.Color(COLORS[actor.label] || "#cccccc"));
    const selection = selectLibraryAsset(manifest, actor, 0);
    return {
      actor,
      selection,
      size: actor.size,
      keys: new Map(actor.keys.map((key) => [key.frame, key])),
      rawKeys: actor.keys,
      model: null,
    };
  });
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;

  const loading = attachLibraryModels(actors, libraryGroup, frameTimes);
  return { group, actors, mesh, libraryGroup, loading };
}

function buildEgo(layout) {
  const group = new THREE.Group();
  const points = layout.frames.map((f) => new THREE.Vector3(f.T_world_lidar[0][3],
    f.T_world_lidar[1][3], f.T_world_lidar[2][3] - 1.6));
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({ color: "#ffd34d" })));
  const ego = new THREE.Mesh(new THREE.BoxGeometry(4.0, 1.8, 1.5),
    new THREE.MeshStandardMaterial({ color: "#ffd34d", roughness: 0.4 }));
  group.add(ego);
  return { group, ego };
}

function matrix4(rows) {
  return new THREE.Matrix4().set(...rows.flat());
}

const state = { frame: 0, playing: false, lidar: null, run: "" };

  async function showLidar() {
    if (state.lidar) { world.remove(state.lidar); state.lidar.geometry.dispose(); state.lidar = null; }
    const frame = frames[state.frame];
    if (!state.run) return "";
    const response = await fetch(`${scene}/runs/${state.run}/lidar/${String(frame.index).padStart(6, "0")}.bin`);
    if (!response.ok) return ` · LiDAR ${state.run}: frame này chưa render`;
    const data = new Float32Array(await response.arrayBuffer());
    const count = data.length / 5;
    const position = new Float32Array(count * 3), color = new Float32Array(count * 3);
    const T = matrix4(frame.T_world_lidar), v = new THREE.Vector3();
    for (let i = 0; i < count; i++) {
      v.set(data[5 * i], data[5 * i + 1], data[5 * i + 2]).applyMatrix4(T);
      position.set([v.x, v.y, v.z], 3 * i);
      const t = Math.min(data[5 * i + 3] / 150, 1);
      color.set([0.2 + 0.8 * t, 1.0, 0.3 + 0.7 * t], 3 * i);
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(position, 3));
    geometry.setAttribute("color", new THREE.BufferAttribute(color, 3));
    state.lidar = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.12, vertexColors: true }));
    world.add(state.lidar);
    return ` · LiDAR ${state.run}: ${count} điểm`;
  }


  async function setFrame(index) {
    state.frame = index;
    $("frame").value = index;
    $("frameLabel").textContent = `${index}/${frames.length - 1}`;
    const frame = frames[index];
    let visible = 0;
    let libraryVisible = 0;
    let boxVisible = 0;
    const useLibrary = $("useLibraryActors") ? $("useLibraryActors").checked : true;
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), z = new THREE.Vector3(0, 0, 1);

    activeMixers.length = 0;

    actors.forEach((item, i) => {
      const { size, keys, model } = item;
      const key = keys.get(frame.index);
      if (key) visible++;

      const hasLibraryModel = useLibrary && model !== null;
      if (hasLibraryModel) {
        if (key) {
          libraryVisible++;
          model.root.visible = true;
          model.root.position.set(...key.center);
          model.root.rotation.set(0, 0, key.yaw);

          if (model.mixer) {
            activeMixers.push(model.mixer);
            const speedInfo = model.speeds.get(frame.index) || { walking: false, playSpeed: 1 };
            if (speedInfo.walking && model.walkAction) {
              if (model.idleAction) model.idleAction.stop();
              model.walkAction.timeScale = speedInfo.playSpeed;
              model.walkAction.play();
            } else if (model.idleAction) {
              if (model.walkAction) model.walkAction.stop();
              model.idleAction.timeScale = 1.0;
              model.idleAction.play();
            } else if (model.walkAction) {
              model.walkAction.timeScale = 0;
              model.walkAction.play();
            }
            model.mixer.update(0);
          }
        } else {
          model.root.visible = false;
          model.root.position.set(0, 0, -1000);
        }

        m.compose(new THREE.Vector3(0, 0, -1000), q, new THREE.Vector3(0, 0, 0));
        actorMesh.setMatrixAt(i, m);
        actorMesh.userData.lamps.setMatrixAt(i * 2, m);
        actorMesh.userData.lamps.setMatrixAt(i * 2 + 1, m);
      } else {
        if (model) {
          model.root.visible = false;
          model.root.position.set(0, 0, -1000);

        if (key) boxVisible++;
        m.compose(new THREE.Vector3(...(key ? key.center : [0, 0, -1000])),

    status(`Frame ${frame.index} · ${visible} xe/người (${libraryVisible} mẫu thư viện, ${boxVisible} khối hộp)${lidar}`);
    redraw();

  async function environment() {

    $("generate").disabled = true;
    try {
      const result = await post("/api/traffic", {scene, params: traffic()});
      world.remove(actorGroup);
      for (const mesh of [actorMesh, actorMesh.userData.lamps]) {
        mesh.geometry.dispose(); mesh.material.dispose(); mesh.dispose();
      }
      ({group: actorGroup, actors, mesh: actorMesh, libraryGroup, loading: actorLoading} =
        buildActors({actors: result.actors}, libraryManifest, frameTimes));
      actorGroup.visible = $("showActors").checked;
      world.add(actorGroup);
      await actorLoading;
      while (paths.children.length) {
        const line = paths.children[0]; paths.remove(line); line.geometry.dispose(); line.material.dispose();
      }
      result.actors.filter(a => a.keys.length > 1).forEach(a => paths.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(a.keys.map(k => new THREE.Vector3(...k.center))),
        new THREE.LineBasicMaterial({color: COLORS[a.label] || "#cccccc"}))));
      $("checks").textContent = JSON.stringify(result.checks, null, 2);
      await setFrame(state.frame); await environment();
      state.playing = true; $("play").textContent = "⏸";
    } finally { $("generate").disabled = false; }
  }));
  $("render").addEventListener("click", guarded(async () => {
    $("render").disabled = true;
    const name = $("scenarioName").value;
    try {
      const scenario = {schema:2, name, seed: Number($("seed").value), engine:"eevee", samples:16,
        frames:[frames[state.frame].index], cameras:[], resolution_scale:.5,
        weather:{preset:$("preset").value, ...weather()}, traffic:{...traffic(), color_randomization:true}};
      const {job} = await post("/api/render", {scene, scenario});
      const poll = async () => {
        try {
          const result = await json(`/api/jobs/${job}`);
          $("jobStatus").textContent = `${result.status} · ${result.exit_code ?? ""}\n${result.log_tail}`;
          if (["queued","running"].includes(result.status)) { setTimeout(poll, 1500); return; }
          $("render").disabled = false;
          if (result.status !== "ok") return;
          const info = await json(`${scene}/runs/${name}/run.json`);
          addRun({name, ...info});
          $("gallery").replaceChildren();
          for (const cam of info.cameras) {
            const image = document.createElement("img"); image.alt = cam; image.title = cam;
            image.src = `${scene}/runs/${name}/images/${cam}/${String(info.frames[0]).padStart(6,"0")}.png?t=${Date.now()}`;
            $("gallery").appendChild(image);
          }
        } catch (error) { $("error").textContent = error.message; $("render").disabled = false; }
      };
      await poll();
    } catch (error) { $("render").disabled = false; throw error; }
  }));
  state.animateRain = time => {
    if (!rain.visible) return;
    rain.position.z = -(time / 1000 * 12) % 25;
    redraw();
  };
  await actorLoading;
  const urlPreset = new URLSearchParams(location.search).get("preset");
  if (urlPreset && $("preset").querySelector(`option[value="${urlPreset}"]`)) {
    $("preset").value = urlPreset;
    $("preset").dispatchEvent(new Event("change"));
  } else {
    await environment();
  }
  await setFrame(0);
  focusEgo(false);
}

const clock = new THREE.Clock();
const sunOffset = new THREE.Vector3(), sunDirection = new THREE.Vector3(0.4, -0.3, 0.8).normalize();
// AO only for meshes: Gaussian splats have no reliable depth for it.
const usePostFx = () => !["trained", "msplat"].includes(document.querySelector("#background")?.value)
  && !document.querySelector("#background")?.value?.includes("splat");
renderer.setAnimationLoop((time) => {
  const delta = clock.getDelta();
  if (state.animateRain) state.animateRain(time);
  if (state.playing && activeMixers.length > 0) {
    for (const mixer of activeMixers) mixer.update(delta);
    dirty = true;
  }
  // OrbitControls.update() returns true while damping still moves the camera.
  if (controls.update() || dirty) {
    sun.target.position.copy(controls.target);
    sun.position.copy(controls.target).add(sunOffset.copy(sunDirection).multiplyScalar(250));
    if (usePostFx()) composer.render(); else renderer.render(world, camera);
    dirty = false;
  }
});
main().catch((error) => { $("error").textContent = String(error.message || error); status(""); });
</script>
</body>
</html>
